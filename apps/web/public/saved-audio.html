<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기기에 저장한 말씀 · 새가나안교회 만나</title>
<style>body{font:1rem/1.6 system-ui;max-width:38rem;margin:3rem auto;padding:1rem;color:#224839}button,audio{display:block;margin:.75rem 0;max-width:100%}button{padding:.65rem}</style>
<h1>기기에 저장한 말씀</h1><p id="message">저장한 말씀을 확인하고 있습니다.</p><div id="list"></div><audio controls hidden></audio><a href="/">새가나안교회 만나 열기</a>
<script>
(async () => {
 const cache = await caches.open("manna-audio-v1");
 const keys = await cache.keys();
 const audio = document.querySelector("audio");
 let source, seq = 0;
 document.querySelector("#message").textContent = keys.length ? "들을 말씀을 선택하세요." : "이 기기에 저장한 말씀이 없습니다.";
 for (const key of keys) {
   const response = await cache.match(key);
   const button = document.createElement("button");
   button.textContent = decodeURIComponent(response.headers.get("X-Manna-Title"));
   button.onclick = async () => {
     const request = ++seq;
     const saved = await cache.match(key);
     if (!saved) return;
     const blob = await saved.blob();
     if (request !== seq) return;
     if (source) URL.revokeObjectURL(source);
     source = URL.createObjectURL(blob);
     audio.src = source; audio.hidden = false; audio.play().catch(() => {});
   };
   document.querySelector("#list").append(button);
 }
})().catch(() => document.querySelector("#message").textContent = "저장한 말씀을 열 수 없습니다.");
</script></html>
