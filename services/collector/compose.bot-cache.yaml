# Optional: only mount a trusted hoho_ytdl_bot output folder. Set BOT_AUDIO_HOST_DIR in the shell.
services:
  collector:
    environment:
      BOT_AUDIO_DIR: /bot-audio
    volumes:
      - type: bind
        source: ${BOT_AUDIO_HOST_DIR:?Set BOT_AUDIO_HOST_DIR to the NAS bot output folder}
        target: /bot-audio
        read_only: true
